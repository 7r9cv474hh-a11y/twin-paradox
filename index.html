const DIRS={L:[-1,0],R:[1,0],U:[0,-1],D:[0,1]};
function init(L){const s={a:null,b:null,k:[],t:0};L.g.forEach((r,y)=>[...r].forEach((c,x)=>{if(c=='A')s.a=[x,y];if(c=='B')s.b=[x,y];if(c=='K')s.k.push([x,y])}));return s}
function cell(L,x,y){const c=(L.g[y]||'')[x]||'#';return 'AaBbK.'.includes(c)?(c=='a'||c=='b'?'c':'.'):c}
function rpos(L,s){return L.r?L.r[s.t%L.r.length]:null}
function step(L,s,dir){
 const [dx,dy]=DIRS[dir];const n={a:s.a.slice(),b:s.b.slice(),k:s.k.map(p=>p.slice()),t:s.t};
 const R=rpos(L,s),eq=(p,x,y)=>p&&p[0]==x&&p[1]==y;
 const solid=(x,y)=>{const c=cell(L,x,y);return c=='#'||c=='C'||c=='G'};
 let fail=null;const moved=[false,false],pushed=[];
 for(const w of['a','b']){
  const ddx=(w=='b'&&L.m)?-dx:dx;const p=n[w],o=n[w=='a'?'b':'a'];const x=p[0]+ddx,y=p[1]+dy;
  const c=cell(L,x,y);
  if(solid(x,y)||eq(o,x,y)||eq(R,x,y))continue;
  if(c=='D'){fail=fail||'dog';continue}
  if(c=='S'){fail=fail||'sister';continue}
  const bi=n.k.findIndex(q=>eq(q,x,y));
  if(bi>=0){const bx=x+ddx,by=y+dy,bc=cell(L,bx,by);
   if(solid(bx,by)||bc=='D'||bc=='S'||n.k.some(q=>eq(q,bx,by))||eq(o,bx,by)||eq(R,bx,by))continue;
   n.k[bi]=[bx,by];pushed.push(bi)}
  p[0]=x;p[1]=y;moved[w=='a'?0:1]=true}
 if(L.r){const N=L.r[(s.t+1)%L.r.length];if(!eq(n.a,...N)&&!eq(n.b,...N)&&!n.k.some(q=>eq(q,...N)))n.t=s.t+1}
 const win=!fail&&[n.a,n.b].every(p=>cell(L,...p)=='c');
 return {s:n,fail,moved,pushed,win};
}
function key(L,s){return s.a+'|'+s.b+'|'+s.k.map(String).sort().join(';')+'|'+(L.r?s.t%L.r.length:0)}
function solve(L){const s0=init(L);const seen=new Map([[key(L,s0),null]]);const q=[[s0,'']];
 while(q.length){const [s,path]=q.shift();for(const d of'LRUD'){const r=step(L,s,d);if(r.fail)continue;if(r.win)return path+d;const k=key(L,r.s);if(!seen.has(k)){seen.set(k,1);q.push([r.s,path+d])}}}return null}


const PAR=[4,3,5,7,14,5,11,6,9,12];
const $=id=>document.getElementById(id);
const cv=$('c'),cx=cv.getContext('2d');
let save={u:1,st:{}};try{save=Object.assign(save,JSON.parse(localStorage.getItem('tp_save')||'{}'))}catch(e){}
const wsave=()=>{try{localStorage.setItem('tp_save',JSON.stringify(save))}catch(e){}};
let li=0,L,S,hist=[],moves=0,mode='title',anim=null,fx=[],toast=null,won=false,endT=0;
// ---- audio
let ac=null,muted=localStorage.getItem('tp_mute')=='1';
function A(){if(!ac){try{ac=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(ac&&ac.state=='suspended')ac.resume();return ac}
function tone(f,d,type='sine',v=.15,t0=0,f2){const a=A();if(!a||muted)return;const t=a.currentTime+t0,o=a.createOscillator(),g=a.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.01);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d+.02)}
const sfx={
 move(){const b=600+Math.random()*200;tone(b,.07,'sine',.08,0,b*1.4)},
 giggle(){const b=700+Math.random()*150;for(let i=0;i<4;i++)tone(b+i*90,.06,'triangle',.1,i*.065,b+i*90+250)},
 bonk(){tone(180,.12,'sine',.18,0,90)},
 push(){tone(120,.1,'square',.06,0,80)},
 woof(){tone(260,.16,'sawtooth',.15,0,140);tone(240,.18,'sawtooth',.15,.2,120)},
 wah(){tone(500,.5,'triangle',.12,0,300)},
 win(){[523,659,784,1047].forEach((f,i)=>tone(f,.25,'triangle',.12,i*.09))},
 lull(){[784,659,587,523,587,659,523].forEach((f,i)=>tone(f,.5,'sine',.08,i*.42))}
};
// ---- level
function load(i){li=i;L=LEVELS[i];S=init(L);hist=[];moves=0;won=false;anim=null;fx=[];mode='play';
 $('lt').textContent=(i+1)+'. '+L.t;$('ls').textContent=L.s;
 $('mb').textContent=L.m?'↔ MIRROR':'⇉ COPY';$('mb').className=L.m?'mir':'cop';
 $('ov').className='hide';hud();resize()}
function hud(){$('mv').textContent='Moves '+moves+' · par '+PAR[li]}
function starsFor(i,m){return m<=PAR[i]?3:m<=Math.ceil(PAR[i]*1.5)+1?2:1}
function totalStars(){return Object.values(save.st).reduce((a,b)=>a+b,0)}
function input(d){A();if(mode!='play'||won)return;if(anim&&anim.p<1)anim.p=1;
 const r=step(L,S,d);
 if(r.fail){const w=r.fail;sfx[w=='dog'?'woof':'wah']();shake=12;
  say(w=='dog'?'The dog is awake. Everyone is awake. Start over.':'You crawled on your sister. She will remember this at Thanksgiving.');
  fx.push({k:'bang',who:w,t:0});mode='fail';setTimeout(()=>{if(mode=='fail'){mode='play';const s0=init(L);S=s0;hist=[];moves=0;hud()}},1400);return}
 if(!r.moved[0]&&!r.moved[1]){sfx.bonk();bonkT=1;shake=4;if(r.s.t===S.t)return}
 hist.push(S);anim={from:S,to:r.s,p:0,moved:r.moved,d};S=r.s;moves++;hud();
 if(r.pushed.length)sfx.push();
 (r.moved[0]&&r.moved[1])?sfx.move():(sfx.giggle(),fx.push({k:'hehe',w:r.moved[0]?'b':'a',t:0}));
 if(r.win){won=true;setTimeout(()=>clear(),520)}}
function undo(){if(mode!='play'||won||!hist.length)return;S=hist.pop();moves++;anim=null;hud();sfx.bonk()}
function restart(){if(mode!='play'&&mode!='fail')return;mode='play';S=init(L);hist=[];moves=0;anim=null;won=false;hud()}
function clear(){sfx.win();for(let i=0;i<30;i++)fx.push({k:'conf',x:Math.random(),y:-.1*Math.random(),vy:.3+Math.random()*.5,vx:(Math.random()-.5)*.2,c:['#ff8fb1','#7fd6c2','#ffd166','#9ab7ff'][i%4],t:0});
 const st=starsFor(li,moves);save.st[li]=Math.max(save.st[li]||0,st);save.u=Math.max(save.u,li+2);wsave();
 if(li==LEVELS.length-1){setTimeout(ending,900);return}
 mode='clear';show(`<div class=big>${'★'.repeat(st)}<span class=dim>${'★'.repeat(3-st)}</span></div><h2>${pick(['Cookies achieved.','Both of them. Same move.','Nobody cried. Write it down.','Statistically impossible.','Synchronized snacking.'])}</h2><p>${moves} moves · par ${PAR[li]}</p><button id=bn>Next →</button>`);
 $('bn').onclick=()=>load(li+1)}

function say(t){toast={t,ttl:2.2};}
function show(h){$('ov').innerHTML=h;$('ov').className=''}
function showEnd(h){$('ov').innerHTML=h;$('ov').className='endov'}
function title(){mode='title';const n=Math.min(save.u,LEVELS.length);
 let lv='';for(let i=0;i<LEVELS.length;i++)lv+=`<button class="lv${i<n?'':' lock'}" data-i=${i}>${i+1}<small>${'★'.repeat(save.st[i]||0)||'&nbsp;'}</small></button>`;
 show(`<div class=logo>THE TWIN<br>PARADOX</div><p class=tag>One swipe moves both babies. Get both to a cookie on the same move.</p><button id=bp>${save.u>1?'Continue':'Play'}</button><div class=grid>${lv}</div><p class=dim2>★ ${totalStars()} / 30</p>`);

 document.querySelectorAll('.lv').forEach(b=>b.onclick=()=>{const i=+b.dataset.i;if(i<n){A();load(i)}})}
function ending(){mode='end';endT=0;sfx.lull();$('ov').className='hide'}
function endCard(){showEnd(`<h2 class=endh>Both asleep.<br>Same time.</h2><p class=endp>Screenshot this, nobody will believe you.</p><div class=big>★ ${totalStars()} / 30</div><button id=bt>Back to the living room</button>`);$('bt').onclick=()=>{title()}}
// ---- input
const kmap={ArrowLeft:'L',ArrowRight:'R',ArrowUp:'U',ArrowDown:'D',a:'L',d:'R',w:'U',s:'D',A:'L',D:'R',W:'U',S:'D'};
addEventListener('keydown',e=>{if(kmap[e.key]){e.preventDefault();input(kmap[e.key])}else if(e.key=='z'||e.key=='u'||e.key=='Backspace')undo();else if(e.key=='r')restart();else if(e.key=='Enter'){const b=$('ov').querySelector('button');if(b&&$('ov').className!='hide')b.click()}});
let ts=null;const area=$('play');
area.addEventListener('touchstart',e=>{const t=e.touches[0];ts=[t.clientX,t.clientY]},{passive:true});

area.addEventListener('touchend',e=>{if(!ts)return;const t=e.changedTouches[0],dx=t.clientX-ts[0],dy=t.clientY-ts[1];ts=null;if(Math.max(Math.abs(dx),Math.abs(dy))<18)return;input(Math.abs(dx)>Math.abs(dy)?(dx>0?'R':'L'):(dy>0?'D':'U'))});
let ms=null;area.addEventListener('mousedown',e=>ms=[e.clientX,e.clientY]);addEventListener('mouseup',e=>{if(!ms)return;const dx=e.clientX-ms[0],dy=e.clientY-ms[1];ms=null;if(Math.max(Math.abs(dx),Math.abs(dy))<18)return;input(Math.abs(dx)>Math.abs(dy)?(dx>0?'R':'L'):(dy>0?'D':'U'))});
document.querySelectorAll('[data-d]').forEach(b=>b.addEventListener('pointerdown',e=>{e.preventDefault();input(b.dataset.d)}));
$('bu').onclick=undo;$('br').onclick=restart;$('bh').onclick=title;
$('bm').onclick=()=>{muted=!muted;localStorage.setItem('tp_mute',muted?'1':'0');$('bm').textContent=muted?'🔇':'🔊'};$('bm').textContent=muted?'🔇':'🔊';
// ---- render
let W=0,H=0,T=40,ox=0,oy=0,dpr=1,shake=0,bonkT=0,last=0;
function resize(){dpr=Math.min(devicePixelRatio||1,3);const r=area.getBoundingClientRect();W=r.width;H=r.height;cv.width=W*dpr;cv.height=H*dpr;cv.style.width=W+'px';cv.style.height=H+'px';
 const g=(L||LEVELS[0]).g;T=Math.floor(Math.min(W/g[0].length,H/g.length));ox=(W-T*g[0].length)/2;oy=(H-T*g.length)/2}
addEventListener('resize',resize);
const rr=(x,y,w,h,r)=>{cx.beginPath();cx.roundRect(x,y,w,h,r)};
function floor(x,y){cx.fillStyle=(x+y)%2?'#f6e7d2':'#f1dfc6';cx.fillRect(ox+x*T,oy+y*T,T+.5,T+.5)}
function wall(x,y){const X=ox+x*T,Y=oy+y*T;cx.fillStyle='#b9a6d6';cx.fillRect(X,Y,T+.5,T+.5);cx.fillStyle='#a993c9';cx.fillRect(X,Y+T*.8,T+.5,T*.2)}
function couch(x,y){const X=ox+x*T,Y=oy+y*T;cx.fillStyle='#5f8fb8';rr(X+T*.04,Y+T*.12,T*.92,T*.8,T*.18);cx.fill();cx.fillStyle='#78a6cf';rr(X+T*.12,Y+T*.35,T*.76,T*.45,T*.12);cx.fill()}
function gate(x,y){const X=ox+x*T,Y=oy+y*T;cx.fillStyle='#fff';cx.strokeStyle='#cfc2b0';cx.lineWidth=T*.06;rr(X+T*.1,Y+T*.05,T*.8,T*.9,T*.08);cx.stroke();for(let i=1;i<4;i++){cx.fillRect(X+T*(.1+i*.2)-T*.03,Y+T*.08,T*.06,T*.84)}}
function cookie(x,y,tm){const X=ox+(x+.5)*T,Y=oy+(y+.5)*T+Math.sin(tm*3+x)*T*.03;cx.fillStyle='rgba(0,0,0,.08)';cx.beginPath();cx.ellipse(X,oy+(y+.8)*T,T*.25,T*.07,0,0,7);cx.fill();cx.fillStyle='#d9a066';cx.beginPath();cx.arc(X,Y,T*.24,0,7);cx.fill();cx.fillStyle='#5b3a21';[[-.08,-.06],[.09,-.02],[-.02,.1],[.1,.11],[-.11,.07]].forEach(([a,b])=>{cx.beginPath();cx.arc(X+a*T,Y+b*T,T*.03,0,7);cx.fill()})}
function block(x,y,i){const X=ox+x*T,Y=oy+y*T,c=['#ff8fb1','#ffd166','#7fd6c2','#9ab7ff'][i%4];cx.fillStyle='rgba(0,0,0,.12)';rr(X+T*.12,Y+T*.18,T*.8,T*.78,T*.1);cx.fill();cx.fillStyle=c;rr(X+T*.1,Y+T*.1,T*.8,T*.78,T*.1);cx.fill();cx.fillStyle='#fff';cx.font=`bold ${T*.42}px system-ui`;cx.textAlign='center';cx.textBaseline='middle';cx.fillText('ABCD'[i%4],X+T*.5,Y+T*.5)}
function dog(x,y,tm,awake){const X=ox+(x+.5)*T,Y=oy+(y+.55)*T,b=awake?0:Math.sin(tm*2)*T*.02;cx.fillStyle='#c9874a';cx.beginPath();cx.ellipse(X,Y,T*.42,T*.26+b,0,0,7);cx.fill();cx.beginPath();cx.arc(X+T*.28,Y-T*.08,T*.17,0,7);cx.fill();cx.fillStyle='#8a5530';cx.beginPath();cx.ellipse(X+T*.2,Y-T*.18,T*.06,T*.12,-.6,0,7);cx.fill();cx.strokeStyle='#3b2a1e';cx.lineWidth=T*.03;cx.beginPath();if(awake){cx.arc(X+T*.33,Y-T*.1,T*.035,0,7);cx.fillStyle='#3b2a1e';cx.fill()}else{cx.arc(X+T*.33,Y-T*.1,T*.04,0,Math.PI)};cx.stroke();
 if(!awake)zzz(X+T*.3,Y-T*.35,tm)}
